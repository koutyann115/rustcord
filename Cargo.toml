[package]
name = "rustcord"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/koutyann115/rustcord"
readme = "README.md"
keywords = ["discord", "rust", "webview2", "lightweight", "desktop"]
categories = ["gui"]
description = "Ultra-lightweight Rust + WebView2 Discord desktop client with memory optimization, themes, gamer tools, and multi-profile switching"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
tray-icon = "0.26"
global-hotkey = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
