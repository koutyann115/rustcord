name: Build & Release Windows Binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting & compile
        run: cargo check --locked

      - name: Build optimized release binary
        run: cargo build --release --locked

      - name: Stage Rustcord.exe
        shell: pwsh
        run: |
          Copy-Item target/release/rustcord.exe Rustcord.exe -Force
          Get-FileHash Rustcord.exe -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustcord-windows-x64
          path: Rustcord.exe

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Rustcord.exe
          generate_release_notes: true
